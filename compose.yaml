services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: heavymonitor
      POSTGRES_USER: heavymonitor
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configura POSTGRES_PASSWORD en .env}
    ports: ["127.0.0.1:5432:5432"]
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./database/001_initial.sql:/docker-entrypoint-initdb.d/001_initial.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U heavymonitor"]
      interval: 5s
      retries: 10
  mosquitto:
    image: eclipse-mosquitto:2
    ports: ["127.0.0.1:1883:1883"]
    volumes:
      - ./mqtt/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mqtt_data:/mosquitto/data
volumes:
  postgres_data:
  mqtt_data:
